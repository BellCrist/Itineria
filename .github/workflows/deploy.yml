name: Deploy to AWS EC2 via AWS SSM (OIDC)

on:
  push:
    branches:
      - main

# Permessi necessari per permettere a GitHub di richiedere il token OIDC ad AWS
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Scarica il codice
      - name: Checkout del codice
        uses: actions/checkout@v4

      # 2. Autenticazione sicura su AWS tramite OIDC
      - name: Configura AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Login su Amazon ECR
      - name: Login su Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      # 4. Build e Push dell'immagine Docker
      - name: Build e Push dell'immagine su ECR
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: travel-diary
          IMAGE_TAG: latest
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 5. Deploy tramite AWS Systems Manager (SSM)
      - name: Esegui Deploy via AWS SSM Run Command
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying latest docker image via GitHub Actions" \
            --parameters 'commands=[
              "aws ecr get-login-password --region '${{ secrets.AWS_REGION }}' | docker login --username AWS --password-stdin '${{ secrets.ECR_REGISTRY }}'",
              "docker pull '${{ secrets.ECR_REGISTRY }}'/travel-diary:latest",
              "docker stop itinerary-app || true",
              "docker rm itinerary-app || true",
              "docker run -d --name itinerary-app -p 80:8080 --env-file /home/ubuntu/.env.production '${{ secrets.ECR_REGISTRY }}'/travel-diary:latest"
            ]'
